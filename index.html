<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1170x2532.png?v=2">

<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/splash-828x1792.png?v=2">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/splash-750x1334.png?v=2">

<title>Family Market</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f6f7f9; --card:#ffffff; --soft:#f1f3f6; --line:#e9ecf1;
  --ink:#0d1321; --ink2:#4a5366; --mute:#8a92a3;
  --blue:#2a78d6; --blue-soft:#eaf1fb; --navy:#0d2c57;
  --up:#0a7a32; --up-soft:#e3f4ea; --dn:#d13b34; --dn-soft:#fbe7e6;
  --warn-bg:#fff6dc; --warn:#6b4a00;
  --shadow:0 1px 2px rgba(13,19,33,.04),0 6px 18px rgba(13,19,33,.05);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}
[hidden]{display:none!important}

/* ---------- lock ---------- */
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(170deg,#fff 0%,var(--bg) 60%)}
.lock-card{width:100%;max-width:360px;text-align:center}
.lock-card img{width:76px;height:76px;border-radius:18px;display:block;margin:0 auto 18px;box-shadow:0 10px 26px rgba(13,44,87,.28)}
.lock-card h1{margin:0 0 6px;font-size:26px;letter-spacing:-.5px;font-weight:800}
.lock-card p{margin:0 0 26px;color:var(--ink2);font-size:14.5px}
.lock-card input[type=password]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;font-size:17px;margin-bottom:12px;text-align:center;box-shadow:var(--shadow);outline:none}
.lock-card input[type=password]:focus{border-color:var(--blue)}
.remember{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;color:var(--ink2);margin:4px 0 18px}
.lock-err{color:var(--dn);font-size:13px;min-height:18px;margin-top:12px}
.btn{border:0;border-radius:14px;padding:15px 16px;font-weight:700;font-size:15.5px;cursor:pointer;background:var(--ink);color:#fff;width:100%}
.btn:disabled{opacity:.55}

/* ---------- shell ---------- */
.app{max-width:560px;margin:0 auto;padding:10px 16px calc(100px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:32px;height:32px;border-radius:9px;display:block}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.top-r{display:flex;align-items:center;gap:10px;flex:none}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.live.on{background:var(--up-soft);color:var(--up)}
.live.on i{background:var(--up);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(10,122,50,.45)}70%{box-shadow:0 0 0 7px rgba(10,122,50,0)}100%{box-shadow:0 0 0 0 rgba(10,122,50,0)}}
.link{background:none;border:0;color:var(--blue);font-weight:700;font-size:14px;cursor:pointer;padding:4px 0}

/* ticker tape */
.tape{margin:0 -16px 14px;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;position:relative}
.tape-in{display:inline-flex;gap:22px;padding:9px 16px;animation:tape 40s linear infinite}
.tape-in span{font-size:12.5px;font-weight:700;color:var(--ink)}
.tape-in span b{font-weight:700;margin-left:5px}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* cards */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.sec-t{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px}
.sec-t h2{margin:0;font-size:13px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.sec-t span{font-size:12px;color:var(--mute)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:11px 13px;font-size:13px;line-height:1.45;margin-bottom:12px}

/* hero */
.hero .k{font-size:13px;color:var(--ink2);font-weight:500}
.hero .tot{font-size:38px;font-weight:800;letter-spacing:-1.4px;margin:2px 0 4px;line-height:1.1}
.hero .chg{font-size:14px;font-weight:700}
.hero .chg small{font-weight:500;color:var(--ink2);font-size:13px}
.tf{display:flex;gap:4px;margin-top:10px;background:var(--soft);padding:3px;border-radius:11px}
.tf button{flex:1;border:0;background:none;font-size:12.5px;font-weight:700;color:var(--ink2);padding:7px 0;border-radius:9px;cursor:pointer}
.tf button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chart{position:relative;margin:12px -4px 0}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .empty{height:150px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mute);font-size:13px;padding:0 20px;line-height:1.45}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .1s}
.tip b{display:block;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow)}
.stat small{display:block;font-size:11.5px;color:var(--mute);font-weight:600;margin-bottom:3px}
.stat b{font-size:16px;font-weight:750;letter-spacing:-.2px}
.note{font-size:12px;color:var(--mute);line-height:1.45;margin:8px 4px 0}

/* holdings */
.list .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.list .row:first-child{border-top:0}
.list .row:active{opacity:.6}
.tk{width:40px;height:40px;border-radius:12px;background:var(--blue-soft);color:var(--blue);font-size:10.5px;font-weight:800;display:grid;place-items:center;flex:none;letter-spacing:-.2px}
.tk.cash{background:var(--soft);color:var(--ink2)}
.tk.big{width:48px;height:48px;font-size:12px;border-radius:14px}
.row .mid{flex:1;min-width:0}
.row .nm{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right}
.row .v{font-size:15px;font-weight:700}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 7px;border-radius:7px;margin-top:3px}
.chip.up{background:var(--up-soft)}.chip.dn{background:var(--dn-soft)}.chip.flat{background:var(--soft);color:var(--ink2)}
.fl-up{animation:flu 1.2s ease}.fl-dn{animation:fld 1.2s ease}
@keyframes flu{0%{background:rgba(10,122,50,.18)}100%{background:transparent}}
@keyframes fld{0%{background:rgba(209,59,52,.18)}100%{background:transparent}}
.subtotal{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);padding-top:10px;border-top:1px solid var(--line);margin-top:2px}

/* segmented */
.seg{display:flex;background:var(--soft);padding:3px;border-radius:12px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px 0;font-weight:700;font-size:13.5px;color:var(--ink2);border-radius:10px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* detail */
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--blue);font-weight:700;font-size:15px;padding:6px 0;cursor:pointer}
.dhead{display:flex;gap:12px;align-items:center;margin:8px 2px 12px}
.dhead .t1{font-size:19px;font-weight:800;letter-spacing:-.3px}
.dhead .t2{font-size:12.5px;color:var(--mute);font-weight:600}
.tv{height:360px;border-radius:14px;overflow:hidden;margin-top:12px;background:var(--soft)}
.tv .tradingview-widget-container,.tv .tradingview-widget-container__widget{height:100%;width:100%}
.mini-news{padding:12px 0;border-top:1px solid var(--line)}
.mini-news:first-child{border-top:0;padding-top:0}
.mini-news h3{font-size:14px;margin:0 0 4px;line-height:1.35}
.mini-news p{font-size:13px;color:var(--ink2);margin:0;line-height:1.5}

/* market */
.mk .row .sub{font-size:11.5px}

/* moves */
.mv{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.mv:first-child{border-top:0}
.mv .d{width:44px;flex:none;font-size:12px;color:var(--mute);font-weight:600;padding-top:2px}
.mv .b{flex:1;min-width:0}
.mv .ty{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.mv .ty.compra{color:var(--blue)}.mv .ty.aporte{color:var(--up)}.mv .ty.venta,.mv .ty.retiro{color:var(--dn)}
.mv .tx{font-size:14px;margin-top:3px;line-height:1.45}
.mv .am{font-weight:700;font-size:14px;white-space:nowrap}
.year{font-size:12px;font-weight:800;color:var(--mute);margin:16px 4px 8px;letter-spacing:.05em}

/* news */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{border:0;background:var(--card);color:var(--ink2);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;box-shadow:var(--shadow)}
.fchip.on{background:var(--ink);color:#fff}
.news{padding:14px 0;border-top:1px solid var(--line)}
.news:first-child{border-top:0;padding-top:2px}
.news .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--soft);color:var(--ink2)}
.badge.cartera{background:var(--blue-soft);color:var(--blue)}
.news .when{font-size:12px;color:var(--mute);margin-left:auto;font-weight:600}
.news h3{font-size:15.5px;line-height:1.35;margin:0 0 6px;font-weight:750;letter-spacing:-.1px}
.news p{font-size:14px;line-height:1.55;color:var(--ink2);margin:0}
.news .src{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--blue);text-decoration:none;font-weight:700}
.resumen{font-size:15px;line-height:1.55}
.ag{display:flex;gap:12px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.ag:first-child{border-top:0;padding-top:0}
.ag .d{width:48px;flex:none;font-weight:800;color:var(--blue);font-size:13px}
.ag.past{opacity:.4}
.idea{padding:12px 0;border-top:1px solid var(--line)}
.idea:first-child{border-top:0;padding-top:0}
.idea h3{font-size:14.5px;margin:0 0 4px}
.idea p{font-size:13.5px;color:var(--ink2);line-height:1.5;margin:0}
.disc{font-size:12px;color:var(--mute);margin-top:12px;font-style:italic}

/* accounts */
.acct .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.acct .nm{font-weight:800;font-size:16.5px;letter-spacing:-.2px}
.acct .who{font-size:12.5px;color:var(--mute);margin-top:3px}
.acct .amt{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:12px}
.acct .amt.na{font-size:15px;color:var(--mute);font-weight:600}
.acct .when{font-size:12px;color:var(--mute)}
.acct .rd{font-size:14px;margin-top:10px;font-weight:700}
.acct .det{font-size:13.5px;color:var(--ink2);line-height:1.55;margin-top:8px;white-space:pre-line}
.tag{font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:26px 10px;line-height:1.5}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;width:100%}
nav.tabs button{background:none;border:0;padding:6px 0 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--mute);cursor:pointer}
nav.tabs svg{width:23px;height:23px}
nav.tabs button.on{color:var(--blue)}

/* perfiles */
.profiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.prof{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--card);border:0;border-radius:18px;padding:18px 10px;box-shadow:var(--shadow);cursor:pointer;font-weight:700;font-size:16px;color:var(--ink)}
.prof:active{transform:scale(.97)}
.av{width:52px;height:52px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:800;font-size:22px;background:#4a5366;flex:none}
.av.sm{width:30px;height:30px;font-size:13px}
.who-sel{display:flex;align-items:center;justify-content:center;gap:12px;font-size:18px;margin-bottom:18px}
.who-sel .av{width:44px;height:44px;font-size:19px}

/* hoja de perfil */
.avbtn{border:0;cursor:pointer;padding:0}
.scrim{position:fixed;inset:0;background:rgba(13,19,33,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.scrim.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 16px;font-size:19px;font-weight:800}
.sh-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sh-head b{font-size:18px}.sh-head .sub{font-size:13px;color:var(--mute)}
.sh-opt{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:var(--soft);border-radius:14px;padding:15px 16px;font-size:15px;font-weight:700;margin-bottom:8px;cursor:pointer;text-align:left;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:700;color:var(--ink2)}
.field input{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 15px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* noticias con portadas */
.resumen-card{background:var(--ink);color:#fff;border-radius:var(--r);padding:16px 18px;font-size:15px;line-height:1.5;margin-bottom:12px;box-shadow:var(--shadow)}
.cv{position:relative;overflow:hidden;background:var(--soft);flex:none}
.cv img,.cv-gen{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv img{z-index:2}
.cv-gen{display:flex;align-items:flex-end;padding:8px 10px}
.cv-gen span{position:relative;z-index:1;color:#fff;font-weight:800;font-size:13px;letter-spacing:-.2px}
.cv-gen svg{position:absolute;left:0;right:0;bottom:22%;width:100%;height:40%}
.nhero{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer}
.nhero .cv.big{width:100%;aspect-ratio:16/9}
.nhero .cv.big .cv-gen{padding:16px 18px}
.nhero .cv.big .cv-gen span{font-size:30px}
.nhb{padding:14px 16px 16px}
.nhb h3{font-size:19px;line-height:1.3;margin:6px 0 0;font-weight:800;letter-spacing:-.3px}
.more{font-size:12.5px;color:var(--blue);font-weight:700;margin-top:8px}
.nhero.open .more{display:none}
.nmeta{display:flex;align-items:center;gap:8px}
.nmeta .when{font-size:12px;color:var(--mute);font-weight:600;margin-left:auto}
.nlist{padding:4px 14px}
.nrow{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.nrow:first-child{border-top:0}
.nrow .cv{width:84px;height:84px;border-radius:12px}
.nrow h3{font-size:14.5px;line-height:1.35;margin:6px 0 0;font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nrow.open h3{-webkit-line-clamp:unset}
.nfull{display:none}
.nrow .nfull{grid-column:1/-1}
.open .nfull{display:block}
.nfull p{font-size:14px;line-height:1.55;color:var(--ink2);margin:8px 0 0}
.nfull .src{display:inline-block;margin-top:8px;font-size:13px;color:var(--blue);text-decoration:none;font-weight:700}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.agc{flex:none;width:150px;background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);scroll-snap-align:start}
.agd{display:flex;align-items:baseline;gap:5px;margin-bottom:8px}
.agd b{font-size:28px;font-weight:800;color:var(--blue);letter-spacing:-1px}
.agd span{font-size:13px;font-weight:700;color:var(--ink2);text-transform:uppercase}
.agt{font-size:13.5px;line-height:1.4;font-weight:600}

.stline b{display:block;font-size:13.5px}.stline span{color:var(--ink2)}
.stline i{width:10px;height:10px;border-radius:50%;margin-top:4px;flex:none;background:var(--dn)}

.sec-t .addbtn{border:0;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer;font-family:inherit}

</style>

<body>

    <h1>Family Market</h1>
    <div id="pickStep"><p>¿Quién sos?</p><div class="profiles" id="profiles"><div class="lock-err">Cargando…</div></div></div>
    <form id="lockForm" hidden autocomplete="off">
      <div class="who-sel"><span class="av" id="selAv"></span><span>Hola, <b id="selName"></b></span></div>

<div id="appRoot" hidden>
<div class="app">
  <header class="top">

  </header>

</div>

<nav class="tabs"><div class="in">
  <button data-tab="inicio" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-tab="cartera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Cartera</button>
  <button data-tab="cripto" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 7.5h4a2 2 0 0 1 0 4h-4zM9.5 11.5h4.5a2 2 0 0 1 0 4H9.5zM9.5 7.5v8M11 6v1.5M11 15.5V17M13 6v1.5M13 15.5V17"/></svg>Cripto</button>
  <button data-tab="mercado"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Mercado</button>

</div></nav>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const S = { d:null, precios:null, noticias:null, cierres:null, tab:'inicio', sub:'pos', nf:'todas', tf:'1D', det:null, dtf:'1D',
            live:{}, prev:{}, liveAt:0, liveOk:false, btc:null, dolar:null, cr:null, crLive:{}, crSeries:{}, ctf:'1D', me:null, perfiles:null, st:{fin:null, cr:null} };
const TABS=['inicio','cartera','cripto','mercado','noticias','cuentas'];
const AVC={igna:'#2a78d6',toto:'#0a7a32',peky:'#c2410c',manu:'#7c3aed'};
const NOMBRES={SPY:'S&P 500',QQQ:'Nasdaq 100',DIA:'Dow Jones'};
const EXCH={ORCL:'NYSE',NU:'NYSE',SPY:'AMEX',DIA:'AMEX',IWM:'AMEX',GLD:'AMEX',SLV:'AMEX',USO:'AMEX',YPF:'NYSE',BMA:'NYSE',PAM:'NYSE',VIST:'NYSE',TSM:'NYSE',JPM:'NYSE',V:'NYSE',KO:'NYSE',DIS:'NYSE',WMT:'NYSE'};
const INDICES=['SPY','QQQ','DIA'];
// listas del apartado Mercado
const MK=[
  {id:'grandes', t:'Grandes tecnológicas', items:[['AAPL','Apple'],['MSFT','Microsoft'],['NVDA','Nvidia'],['GOOGL','Alphabet (Google)'],['AMZN','Amazon'],['META','Meta'],['TSLA','Tesla'],['AVGO','Broadcom'],['TSM','TSMC'],['NFLX','Netflix']]},
  {id:'arg', t:'Argentinas en Wall Street', items:[['MELI','Mercado Libre'],['YPF','YPF'],['GGAL','Grupo Galicia'],['BMA','Banco Macro'],['PAM','Pampa Energía'],['VIST','Vista Energy']]},
  {id:'otras', t:'Otras conocidas', items:[['JPM','JPMorgan'],['V','Visa'],['KO','Coca-Cola'],['WMT','Walmart'],['DIS','Disney']]},
  {id:'mat', t:'Oro, plata y petróleo', items:[['GLD','Oro'],['SLV','Plata'],['USO','Petróleo']]}
];
const MK_IDX=[['SPY','S&P 500'],['QQQ','Nasdaq 100'],['DIA','Dow Jones'],['IWM','Russell 2000']];
const MKC=[['BTC','Bitcoin'],['ETH','Ethereum'],['SOL','Solana'],['XRP','XRP'],['BNB','BNB'],['DOGE','Dogecoin'],['ADA','Cardano']];
const MKC_SET=new Set(MKC.map(x=>x[0]));
MK_IDX.concat(...MK.map(g=>g.items)).forEach(([s,n])=>{ if(!NOMBRES[s]) NOMBRES[s]=n; });
MKC.forEach(([s,n])=>{ if(!NOMBRES[s]) NOMBRES[s]=n; });
// mi lista: acciones que cada uno agrega en su celular
function lista(){ try{ const a=JSON.parse(localStorage.getItem('fm_lista')||'[]'); return Array.isArray(a)? a.filter(x=>x&&x.t) : []; }catch(_){ return []; } }
function setLista(a){ try{ localStorage.setItem('fm_lista', JSON.stringify(a)); }catch(_){} }
function enLista(t){ return lista().some(x=>x.t===t); }
const pxDec = v => v==null? 0 : v<1? 4 : v<1000? 2 : 0;

/* ---------- helpers ---------- */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = typeof v==='number'?v:parseFloat(v); return isFinite(n)?n:0; };
const usd = (n,dec=0) => { if(n==null||!isFinite(n)) return '—'; const s=Math.abs(n).toLocaleString('es-AR',{minimumFractionDigits:dec,maximumFractionDigits:dec}); return (n<0?'−':'')+'US$ '+s; };
const usdS = (n,dec=0) => (n>0?'+':'')+usd(n,dec);
const ars = n => '$ '+Math.round(n).toLocaleString('es-AR');
const usdK = n => { const a=Math.abs(n); return (n<0?'−':'')+(a>=1000? (a/1000).toLocaleString('es-AR',{maximumFractionDigits:a>=100000?0:1})+'k' : Math.round(a)); };
const pct = (n,d=1) => { if(n==null||!isFinite(n)) return '—'; return (n>0?'+':n<0?'−':'')+Math.abs(n).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%'; };
const pctAbs = (n,d=1) => pct(n,d).replace('+','');
const cls = n => n>0?'up':n<0?'dn':'flat';
const arrow = n => n>0?'▲':n<0?'▼':'';
const fdate = s => { if(!s) return '—'; const p=String(s).slice(0,10).split('-'); if(p.length<3) return esc(s); return `${+p[2]}/${+p[1]}/${p[0]}`; };
const fds = s => { if(!s) return ''; const p=String(s).split('-'); return `${+p[2]}/${+p[1]}`; };
const daysSince = s => s? Math.floor((Date.now()-new Date(String(s).slice(0,10)+'T12:00:00').getTime())/86400000) : 0;
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const toB64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const hhmm = t => new Date(t).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
function nyNow(){ try{ return new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'})); }catch(_){ return new Date(); } }
function nyDate(){ const d=nyNow(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function marketOpen(){ const ny=nyNow(); const d=ny.getDay(), m=ny.getHours()*60+ny.getMinutes(); return d>0&&d<6&&m>=570&&m<960; }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
function lsSet(k,v){ try{ if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(_){} }

/* ---------- crypto ---------- */
async function deriveKey(pass, enc){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(enc.salt), iterations:enc.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function decrypt(key, enc){ const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(enc.iv)}, key, b64(enc.ct)); return JSON.parse(new TextDecoder().decode(pt)); }
async function getJSON(url){ const r = await fetch(url+'?t='+Date.now(), {cache:'no-store'}); if(!r.ok) throw new Error('http '+r.status); return r.json(); }

/* ---------- cálculo de la cartera ---------- */
function priceOf(t){
  const L=S.live[t]; if(L && L.c>0) return {p:L.c, pc:L.pc>0?L.pc:null, live:true};
  const c=S.d.cartera, pr=(S.precios&&S.precios.precios)||{}, prF=(S.precios&&S.precios.fecha)||'';
  if(prF && String(prF).slice(0,10)>=String(c.fecha||'') && pr[t]!=null) return {p:num(pr[t]), pc:null, live:false};
  const pos=(c.posiciones||[]).find(x=>x.ticker===t); return {p:pos?num(pos.precio):0, pc:null, live:false};
}
function calc(){
  const c = S.d && S.d.cartera; if(!c) return null;
  const pos=(c.posiciones||[]).map(p=>{
    const cant=num(p.cant), costo=num(p.costo), q=priceOf(p.ticker);
    const valor=cant*q.p, inv=cant*costo, pl=valor-inv;
    const dHoy = q.pc? cant*(q.p-q.pc) : null;
    return {...p, cant, costo, precio:q.p, pc:q.pc, live:q.live, valor, inv, pl, plp: inv? pl/inv*100:0, dHoy, dpHoy: q.pc? (q.p-q.pc)/q.pc*100 : null};
  });
  const liq=(c.liquidez||[]).map(l=>({...l, valor:num(l.valor)}));
  const acciones=pos.reduce((a,p)=>a+p.valor,0), invAcc=pos.reduce((a,p)=>a+p.inv,0);
  const liquidez=liq.reduce((a,l)=>a+l.valor,0), total=acciones+liquidez;
  pos.forEach(p=>p.peso= total? p.valor/total*100:0); liq.forEach(l=>l.peso= total? l.valor/total*100:0);
  pos.sort((a,b)=>b.valor-a.valor);
  const conHoy=pos.filter(p=>p.dHoy!=null), dHoy= conHoy.length? conHoy.reduce((a,p)=>a+p.dHoy,0) : null;
  const aporte=num(c.aporte), live=pos.some(p=>p.live);
  const prF=(S.precios&&S.precios.fecha)||'';
  return {c,pos,liq,acciones,invAcc,liquidez,total,plAcc:acciones-invAcc,aporte,gan:total-aporte,ganp: aporte?(total-aporte)/aporte*100:null,
          dHoy, dpHoy:(dHoy!=null && total-dHoy)? dHoy/(total-dHoy)*100 : null, live,
          fechaPrecios: live? 'live' : (prF && String(prF).slice(0,10)>=String(c.fecha||'') ? prF : c.fecha)};
}
function preciosTxt(k){ return k.fechaPrecios==='live' ? (marketOpen()? 'precios en vivo, '+hhmm(S.liveAt) : 'último precio, '+hhmm(S.liveAt)) : 'precios al '+fdate(k.fechaPrecios); }

/* ---------- series para el gráfico del total ---------- */
function intraKey(){ return 'fm_intra_'+nyDate(); }
function intraGet(){ try{ return JSON.parse(lsGet(intraKey())||'[]'); }catch(_){ return []; } }
function intraAdd(v){
  if(!marketOpen()) return;
  const a=intraGet(); const t=Date.now();
  if(a.length && t-a[a.length-1][0]<15000) return;
  a.push([t, Math.round(v*100)/100]); while(a.length>1500) a.shift();
  lsSet(intraKey(), JSON.stringify(a));
}
function seriesFor(tf, k){
  const now=Date.now();
  if(tf==='1D'){
    let a=intraGet().map(([t,v])=>({t,v}));
    if(!a.length && k.dHoy!=null){ a=[]; } // sin muestras todavía
    return a;
  }
  const days={'1S':7,'1M':31,'1A':366,'Todo':99999}[tf];
  const from=now-days*86400000;
  const pts=[];
  (S.d.historial||[]).forEach(h=>{ if(h.fecha&&h.valor!=null) pts.push({t:new Date(h.fecha+'T20:00:00Z').getTime(), v:num(h.valor), n:h.nota||''}); });
  // cierres diarios (cierres.json): valor = cantidades actuales × cierre + liquidez, solo desde la fecha de la composición
  const cz=(S.cierres&&S.cierres.fechas)||{}, c=S.d.cartera;
  Object.keys(cz).forEach(f=>{
    if(f < String(c.fecha||'')) return;
    const px=cz[f]; let v=0, ok=true;
    (c.posiciones||[]).forEach(p=>{ if(px[p.ticker]==null) ok=false; else v+=num(p.cant)*num(px[p.ticker]); });
    if(!ok) return; v+=(c.liquidez||[]).reduce((a,l)=>a+num(l.valor),0);
    pts.push({t:new Date(f+'T21:00:00Z').getTime(), v, n:'Cierre'});
  });
  pts.push({t:now, v:k.total, n:'Ahora'});
  pts.sort((a,b)=>a.t-b.t);
  // un punto por día (el último)
  const byDay=new Map(); pts.forEach(p=>byDay.set(new Date(p.t).toISOString().slice(0,10), p));
  return [...byDay.values()].filter(p=>p.t>=from);
}

/* ---------- gráfico de línea ---------- */
function niceStep(raw){ if(raw<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(raw))); const f=raw/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function lineChart(el, pts, opts){
  if(!el) return;
  if(pts.length<2){ el.innerHTML=`<div class="empty">${opts.emptyMsg||'Todavía no hay suficientes datos para este período.'}</div>`; return; }
  const W=Math.max(280, el.clientWidth||320), H=170, L=6, R=6, T=12, B=20;
  const base=opts.base;
  let lo=Math.min(...pts.map(p=>p.v), base!=null?base:Infinity), hi=Math.max(...pts.map(p=>p.v), base!=null?base:-Infinity);
  const pad=(hi-lo)*0.12||hi*0.01||1; lo-=pad; hi+=pad;
  const t0=pts[0].t, t1=pts[pts.length-1].t;
  const x=t=>L+(t-t0)/(t1-t0||1)*(W-L-R), y=v=>T+(hi-v)/(hi-lo||1)*(H-T-B);
  const first=base!=null?base:pts[0].v, last=pts[pts.length-1].v;
  const col = last>=first ? 'var(--up)' : 'var(--dn)';
  const gid='g'+Math.random().toString(36).slice(2,7);
  const d=pts.map((p,i)=>(i?'L':'M')+x(p.t).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const area=d+` L${x(t1).toFixed(1)} ${H-B} L${x(t0).toFixed(1)} ${H-B} Z`;
  const bl = base!=null? `<line x1="${L}" x2="${W-R}" y1="${y(base)}" y2="${y(base)}" stroke="#c3c9d3" stroke-dasharray="3 4"/>` : '';
  const lab0=opts.fmtT(pts[0].t), lab1=opts.fmtT(t1);
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'Gráfico')}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${last>=first?'#0a7a32':'#d13b34'}" stop-opacity=".16"/><stop offset="1" stop-color="${last>=first?'#0a7a32':'#d13b34'}" stop-opacity="0"/></linearGradient></defs>
    ${bl}<path d="${area}" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(t1)}" cy="${y(last)}" r="4.5" fill="${col}" stroke="#fff" stroke-width="2"/>
    <line class="cx" y1="${T}" y2="${H-B}" stroke="#8a92a3" opacity="0"/><circle class="cd" r="5" fill="${col}" stroke="#fff" stroke-width="2" opacity="0"/>
    <text x="${L}" y="${H-4}" font-size="10.5" fill="#8a92a3">${esc(lab0)}</text><text x="${W-R}" y="${H-4}" font-size="10.5" fill="#8a92a3" text-anchor="end">${esc(lab1)}</text>
  </svg><div class="tip"></div>`;
  const svg=el.querySelector('svg'), tip=el.querySelector('.tip'), cx=el.querySelector('.cx'), cd=el.querySelector('.cd');
  const move=e=>{ const r=svg.getBoundingClientRect(); const px=(e.clientX-r.left)*(W/r.width);
    let best=pts[0],bd=1e18; pts.forEach(p=>{const dd=Math.abs(x(p.t)-px); if(dd<bd){bd=dd;best=p;}});
    const X=x(best.t), Y=y(best.v); cx.setAttribute('x1',X); cx.setAttribute('x2',X); cx.setAttribute('opacity','.5'); cd.setAttribute('cx',X); cd.setAttribute('cy',Y); cd.setAttribute('opacity','1');
    tip.innerHTML=`<b>${usd(best.v)}</b>${esc(opts.fmtTip(best.t))}${best.n&&best.n!=='Ahora'&&best.n!=='Cierre'?' · '+esc(best.n):''}`;
    tip.style.left=Math.min(Math.max(X*(r.width/W),70),r.width-70)+'px'; tip.style.top=(Y*(r.height/H))+'px'; tip.style.opacity='1'; };
  const out=()=>{ tip.style.opacity='0'; cx.setAttribute('opacity','0'); cd.setAttribute('opacity','0'); };
  svg.addEventListener('pointermove',move); svg.addEventListener('pointerdown',move); svg.addEventListener('pointerleave',out);
}
function drawTotalChart(k){
  const el=document.getElementById('tchart'); if(!el) return;
  const pts=seriesFor(S.tf,k);
  const intraday=S.tf==='1D';
  let base=null;
  if(intraday && k.dHoy!=null) base=k.total-k.dHoy;
  if(intraday && pts.length===1 && base!=null) pts.unshift({t:pts[0].t-60000, v:base});
  lineChart(el, pts, {
    base, aria:'Valor de la cuenta',
    emptyMsg: intraday ? (marketOpen()? 'El gráfico del día se va dibujando mientras tenés la app abierta. Volvé en un rato.' : 'El mercado está cerrado. El gráfico del día se arma mientras la app está abierta en horario de mercado (11:30 a 18 h).') : 'Todavía no hay suficientes datos para este período.',
    fmtT: t => intraday? hhmm(t) : new Date(t).toLocaleDateString('es-AR',{day:'numeric',month:'numeric',year:S.tf==='Todo'||S.tf==='1A'?'2-digit':undefined}),
    fmtTip: t => intraday? hhmm(t) : new Date(t).toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'})
  });
}

/* ---------- vistas ---------- */
function rowPos(p){
  const fl = S.flash[p.ticker]||'';
  return `<button class="row ${fl}" data-det="${esc(p.ticker)}">
    <div class="tk">${esc(String(p.ticker).slice(0,5))}</div>
    <div class="mid"><div class="nm">${esc(p.nombre||p.ticker)}</div><div class="sub num">${p.cant.toLocaleString('es-AR')} × ${usd(p.precio,2)}</div></div>
    <div class="r num"><div class="v">${usd(p.valor)}</div>${p.dpHoy!=null?`<span class="chip ${cls(p.dpHoy)}">${pct(p.dpHoy,2)}</span>`:`<span class="chip ${cls(p.plp)}">${pct(p.plp)}</span>`}</div>
  </button>`;
}
function vInicio(){
  const k=calc(); if(!k) return `<div class="card empty">Todavía no hay datos de la cartera.</div>`;
  const stale=daysSince(k.c.fecha)>21;
  return `
  ${S.askPass?`<div class="banner" style="background:var(--blue-soft);color:var(--navy)">¿Querés usar tu propia clave en este celular? <button class="link" data-act="pass">Crear mi clave</button> · <button class="link" data-act="nopass" style="color:var(--ink2)">Ahora no</button></div>`:''}

function calcCr(){
  const c=S.cr; if(!c) return null;
  const a=(c.activos||[]).map(x=>{
    const L=S.crLive[x.sym], cant=num(x.cant), costo=num(x.costo);
    const p= L? L.c : (num(x.valor_ref)/cant||costo);
    const valor=cant*p, inv=cant*costo, d24= L&&L.dp!=null? valor-valor/(1+L.dp/100) : null;
    return {...x, cant, costo, precio:p, valor, inv, pl:valor-inv, plp: inv?(valor-inv)/inv*100:0, dp: L?L.dp:null, d24, live:!!L};
  }).sort((x,y)=>y.valor-x.valor);
  const total=a.reduce((s,x)=>s+x.valor,0), inv=a.reduce((s,x)=>s+x.inv,0);
  const con=a.filter(x=>x.d24!=null), d24=con.length? con.reduce((s,x)=>s+x.d24,0) : null;
  a.forEach(x=>x.peso= total? x.valor/total*100:0);
  const n=(c.miembros||[]).length||1, aporte=num(c.aporte)||inv;
  return {c,a,total,inv,aporte,pl:total-aporte,plp: aporte?(total-aporte)/aporte*100:0,d24,dp24:(d24!=null&&total-d24)? d24/(total-d24)*100:null,live:a.some(x=>x.live),n};
}
const CTF={'1D':['5m',288],'1S':['1h',168],'1M':['4h',180],'1A':['1d',365]};
async function loadCrSeries(tf){
  if(!S.cr) return; const [iv,lim]=CTF[tf]; const act=S.cr.activos||[];
  const res=await Promise.all(act.map(x=>fetch(`https://api.binance.com/api/v3/klines?symbol=${x.sym}USDT&interval=${iv}&limit=${lim}`).then(r=>r.ok?r.json():null).catch(()=>null)));
  if(res.some(r=>!Array.isArray(r)||!r.length)){
    // respaldo: CoinGecko
    const days={'1D':1,'1S':7,'1M':30,'1A':365}[tf];
    const cg=await Promise.all(act.map(x=>CG[x.sym]? fetch(`https://api.coingecko.com/api/v3/coins/${CG[x.sym]}/market_chart?vs_currency=usd&days=${days}`).then(r=>r.ok?r.json():null).catch(()=>null) : null));
    if(cg.every(j=>j&&Array.isArray(j.prices)&&j.prices.length)){
      const base=cg[0].prices; const pts=[];
      const near=(arr,t)=>{ let best=arr[0]; for(const p of arr){ if(Math.abs(p[0]-t)<Math.abs(best[0]-t)) best=p; } return best[1]; };
      const step=Math.max(1,Math.floor(base.length/300));
      for(let i=0;i<base.length;i+=step){ const t=base[i][0]; let v=0; act.forEach((x,k)=>{ v+=num(x.cant)*near(cg[k].prices,t); }); pts.push({t,v}); }
      S.crSeries[tf]={pts, at:Date.now()}; return;
    }
    if(!S.crSeries[tf]) S.crSeries[tf]={pts:[],err:true}; return;
  }
  const mk=t=>Math.floor(t/60000);
  const maps=res.map(r=>new Map(r.map(k=>[mk(k[0]), parseFloat(k[4])])));
  const pts=[]; res[0].forEach(k=>{ const t=k[0]; let v=0, ok=true; act.forEach((x,i)=>{ const px=maps[i].get(mk(t)); if(px==null) ok=false; else v+=num(x.cant)*px; }); if(ok) pts.push({t, v}); });
  S.crSeries[tf]={pts, at:Date.now()};
}

let keyIdx=0, liveTimer=null, tick=0;
async function fetchQuote(sym){
  const keys=(S.d&&S.d.finnhub)||[]; if(!keys.length) throw new Error('sin clave');
  for(let i=0;i<keys.length;i++){
    const k=keys[(keyIdx+i)%keys.length];
    const r=await fetch('https://finnhub.io/api/v1/quote?symbol='+encodeURIComponent(sym)+'&token='+encodeURIComponent(k));
    if(r.status===401||r.status===403){ S.st.fin={ok:false,msg:'La clave de Finnhub fue rechazada ('+r.status+')',at:Date.now()}; continue; }
    if(r.status===429){ S.st.fin={ok:false,msg:'Finnhub: se pasó el límite de consultas',at:Date.now()}; throw new Error('http 429'); }
    if(!r.ok) throw new Error('http '+r.status);
    keyIdx=(keyIdx+i)%keys.length;
    const q=await r.json(); if(!q||!(q.c>0)) throw new Error('sin dato'); return q;
  }
  throw new Error('clave rechazada');
}
async function refreshStocks(){
  const syms=[...new Set(((S.d.cartera&&S.d.cartera.posiciones)||[]).map(p=>p.ticker).concat(INDICES))];
  const res=await Promise.allSettled(syms.map(s=>fetchQuote(s)));
  let ok=0; S.flash={};
  res.forEach((r,i)=>{ if(r.status!=='fulfilled') return; const s=syms[i], q=r.value; const old=S.live[s];
    if(old&&old.c!==q.c) S.flash[s]= q.c>old.c?'fl-up':'fl-dn';
    S.live[s]={c:q.c, pc:q.pc, dp:q.dp, t:q.t}; ok++; });
  if(ok){ S.liveOk=true; S.liveAt=Date.now(); S.st.fin={ok:true,msg:ok+' de '+syms.length+' cotizaciones en vivo',at:Date.now()}; const k=calc(); if(k&&k.live) intraAdd(k.total); }
  else if(!S.st.fin || S.st.fin.ok){ const e=res.find(r=>r.status==='rejected'); S.st.fin={ok:false,msg:'Finnhub no responde'+(e&&e.reason&&e.reason.message?' ('+e.reason.message+')':''),at:Date.now()}; }
}
// acciones del apartado Mercado: solo mientras se mira, cada 1 min (10 min con el mercado cerrado)
let mkAt=0, mkBusy=false;
function mkWanted(){ return S.tab==='mercado' || (S.det && !S.det.startsWith('C:') && !MKC_SET.has(S.det) && S.det!=='MERVAL'); }
async function refreshMarket(force){
  if(!S.d || mkBusy || !mkWanted()) return;
  if(!force && Date.now()-mkAt < (marketOpen()? 60000 : 600000)) return;
  const own=new Set(((S.d.cartera&&S.d.cartera.posiciones)||[]).map(p=>p.ticker).concat(INDICES));
  let syms=[...new Set(MK_IDX.map(x=>x[0]).concat(...MK.map(g=>g.items.map(i=>i[0])), lista().map(x=>x.t)))].filter(x=>!own.has(x));
  if(S.det && !own.has(S.det) && !syms.includes(S.det) && mkWanted()) syms.push(S.det);
  if(S.tab!=='mercado') syms=syms.filter(x=>x===S.det);
  if(!syms.length) return;
  mkBusy=true; mkAt=Date.now();
  try{
    for(let i=0;i<syms.length;i+=8){
      const part=syms.slice(i,i+8);
      const res=await Promise.allSettled(part.map(x=>fetchQuote(x)));
      res.forEach((r,j)=>{ if(r.status!=='fulfilled') return; const x=part[j], q=r.value, old=S.live[x];
        if(old&&old.c!==q.c) S.flash[x]= q.c>old.c?'fl-up':'fl-dn';
        S.live[x]={c:q.c, pc:q.pc, dp:q.dp, t:q.t}; });
      if(res.some(r=>r.status==='rejected'&&/429/.test(String(r.reason&&r.reason.message)))) break;
    }
  } finally { mkBusy=false; }
}
function setCr(s,c,dp){
  if(!(c>0)) return; const old=S.crLive[s];
  if(old&&old.c!==c) S.flash['C:'+s]= c>old.c?'fl-up':'fl-dn';
  S.crLive[s]={c, dp:isFinite(dp)?dp:null, pc:isFinite(dp)? c/(1+dp/100):null};
  if(s==='BTC'){ if(S.btc&&S.btc.c!==c) S.flash.BTC=c>S.btc.c?'fl-up':'fl-dn'; S.btc={...S.crLive.BTC}; }
}
const CG={BTC:'bitcoin',ETH:'ethereum',BNB:'binancecoin',SOL:'solana',XRP:'ripple',ADA:'cardano',DOGE:'dogecoin'};
async function refreshCrypto(){
  const wantMk = S.tab==='mercado' || (S.det && MKC_SET.has(S.det));
  const syms=[...new Set(['BTC'].concat(((S.cr&&S.cr.activos)||[]).map(a=>a.sym), wantMk? MKC.map(x=>x[0]) : []))];
  // 1) variación 24 h y precio de respaldo: Binance, si no CoinGecko
  const dp={}, px={};
  let src='';
  try{
    const r=await fetch('https://api.binance.com/api/v3/ticker/24hr?symbols='+encodeURIComponent(JSON.stringify(syms.map(s=>s+'USDT'))));
    if(!r.ok) throw new Error('binance '+r.status);
    (await r.json()).forEach(x=>{ const s=x.symbol.replace(/USDT$/,''); dp[s]=parseFloat(x.priceChangePercent); px[s]=parseFloat(x.lastPrice); }); src='Binance';
  }catch(_){
    try{ const want=syms.filter(s=>CG[s]); const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids='+want.map(s=>CG[s]).join(',')+'&vs_currencies=usd&include_24hr_change=true');
      const j=await r.json(); want.forEach(s=>{ const o=j[CG[s]]; if(o){ dp[s]=o.usd_24h_change; px[s]=o.usd; } }); src='CoinGecko'; }catch(_){}
  }
  // 2) precio: Coinbase (el mismo que ven en su app); si falla, el de arriba
  const cb=await Promise.allSettled(syms.map(s=>fetch('https://api.coinbase.com/v2/prices/'+s+'-USD/spot').then(r=>r.ok?r.json():Promise.reject(r.status))));
  let nCb=0;
  syms.forEach((s,i)=>{ const r=cb[i]; let c=null;
    if(r.status==='fulfilled' && r.value && r.value.data){ c=parseFloat(r.value.data.amount); if(c>0) nCb++; }
    if(!(c>0)) c=px[s];
    setCr(s, c, dp[s]);
  });
  const ok=syms.filter(s=>S.crLive[s]).length;
  S.st.cr={ok: ok===syms.length, msg: ok? `Precios: ${nCb?'Coinbase':src}${nCb&&nCb<syms.length?' + '+src:''} · variación 24 h: ${src||'sin dato'}` : 'No responde ninguna fuente de precios cripto', at:Date.now()};
}

  const open=marketOpen();
  const jobs=[refreshCrypto()];
  if(S.cr && (force || (S.tab==='cripto' && !S.det && tick%3===0))) jobs.push(loadCrSeries(S.ctf));
  if(force || (open && tick%2===0) || Date.now()-S.liveAt>300000) jobs.push(refreshStocks());
  jobs.push(refreshMarket(force));
  if(force || tick%15===0) jobs.push(refreshDolar());
  tick++;
  await Promise.allSettled(jobs);
  setPill();
  if(S.det) softDetail(); else if(!(S.tab==='noticias' || S.tab==='cuentas') || force) render(); else renderTape();
}
function startLive(){ if(liveTimer) return; liveCycle(true); liveTimer=setInterval(()=>liveCycle(false), 20000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) liveCycle(true); }); }

/* ---------- actualización automática de la app ---------- */
const APP_VERSION='20261122020500';
async function checkVersion(){
  try{ const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return; const j=await r.json();
    if(j.v && j.v!==APP_VERSION){ const u=new URL(location.href); if(u.searchParams.get('v')===j.v) return; u.searchParams.set('v', j.v); location.replace(u.toString()); }
  }catch(_){}
}
checkVersion();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkVersion(); });
setInterval(checkVersion, 5*60*1000);

/* ---------- acceso por perfil ---------- */
const KEY_STORE='fm_perfil_v2';
const lockEl=document.getElementById('lock'), appEl=document.getElementById('appRoot'), errEl=document.getElementById('lockErr'), btn=document.getElementById('enter');
const formEl=document.getElementById('lockForm'), pickEl=document.getElementById('pickStep');
let SEL=null;
lsSet('fm_key_v1',null);
async function openSealed(rawKey, box){
  const key=await crypto.subtle.importKey('raw', rawKey, {name:'AES-GCM'}, false, ['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(box.iv)}, key, b64(box.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function deriveBits(pass, prof){
  const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', salt:b64(prof.salt), iterations:prof.iter, hash:'SHA-256'}, base, 256));
}
async function loadPublic(){
  const [p,n,c]=await Promise.allSettled([getJSON('precios.json'),getJSON('noticias.json'),getJSON('cierres.json')]);
  S.precios=p.status==='fulfilled'?p.value:null; S.noticias=n.status==='fulfilled'?n.value:null; S.cierres=c.status==='fulfilled'?c.value:null;
}
function localGet(id){ try{ return JSON.parse(lsGet('fm_local_'+id)||'null'); }catch(_){ return null; } }
async function openProfile(prof, pass){
  const loc=localGet(prof.id);
  if(loc){ try{ const bits=await deriveBits(pass, loc); return {g:await openSealed(bits, loc), bits, src:'local', salt:loc.salt}; }catch(_){} }
  const bits=await deriveBits(pass, prof);
  return {g:await openSealed(bits, prof), bits, src:'pub', salt:prof.salt}; // si la clave es incorrecta, falla acá
}
async function loadVaults(g, prof){
  const [vf, vc]=await Promise.all([getJSON('vault-familia.enc.json'), g.keys.cripto? getJSON('vault-cripto.enc.json') : Promise.resolve(null), loadPublic()]);
  const d=await openSealed(b64(g.keys.familia), vf);
  const cr= vc? await openSealed(b64(g.keys.cripto), vc) : null;
  return {d, cr, me:{id:prof.id, nombre:g.nombre}, grant:g};
}
function avatar(el, id, nombre){ el.textContent=(nombre||'?').slice(0,1).toUpperCase(); el.style.background=AVC[id]||'#4a5366'; }
function show(r){
  S.d=r.d; S.cr=r.cr; S.me=r.me; S.grant=r.grant; S.askPass= !localGet(r.me.id) && !lsGet('fm_nopass_'+r.me.id);
  const cb=document.querySelector('nav.tabs button[data-tab=cripto]'); cb.hidden=!S.cr;
  document.querySelector('nav.tabs .in').style.gridTemplateColumns=`repeat(${S.cr?6:5},1fr)`;
  if(S.tab==='cripto'&&!S.cr) S.tab='inicio';
  avatar(document.getElementById('meAv'), S.me.id, S.me.nombre);
  lockEl.hidden=true; appEl.hidden=false; render(); startLive();
  if(S.cr) loadCrSeries(S.ctf).then(()=>{ if(S.tab==='cripto'&&!S.det) drawCrChart(); });
}
function pickProfile(p){
  SEL=p; pickEl.hidden=true; formEl.hidden=false; errEl.textContent='';
  avatar(document.getElementById('selAv'), p.id, p.nombre); document.getElementById('selName').textContent=p.nombre;
  const i=document.getElementById('pass'); i.value=''; setTimeout(()=>i.focus(),50);
}
document.getElementById('changeProf').addEventListener('click',()=>{ SEL=null; formEl.hidden=true; pickEl.hidden=false; });
formEl.addEventListener('submit', async e=>{
  e.preventDefault(); errEl.textContent='';
  const pass=document.getElementById('pass').value.trim(); if(!pass){ errEl.textContent='Escribí tu clave.'; return; }
  if(!window.crypto||!crypto.subtle){ errEl.textContent='Este navegador no permite abrir la app. Probá con Safari o Chrome actualizados.'; return; }
  btn.disabled=true; btn.textContent='Abriendo…';
  try{
    let o; try{ o=await openProfile(SEL, pass); }catch(_){ errEl.textContent='Clave incorrecta.'; return; }
    const r=await loadVaults(o.g, SEL);
    if(document.getElementById('remember').checked) lsSet(KEY_STORE, JSON.stringify({perfil:SEL.id, src:o.src, salt:o.salt, k:toB64(o.bits)}));
    show(r);
  }catch(_){ errEl.textContent='No se pudieron cargar los datos. Revisá la conexión.'; }
  finally{ btn.disabled=false; btn.textContent='Entrar'; }
});
document.getElementById('logout').addEventListener('click',()=>{ lsSet(KEY_STORE,null); location.reload(); });
const scrim=document.getElementById('scrim'), sheet=document.getElementById('sheet');
function closeSheet(){ scrim.classList.remove('open'); sheet.innerHTML=''; }
scrim.addEventListener('click',e=>{ if(e.target===scrim) closeSheet(); });
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2800); }
document.getElementById('meAv').addEventListener('click',()=>{
  const has=!!localGet(S.me.id);
  sheet.innerHTML=`<div class="sh-head"><span class="av" style="background:${AVC[S.me.id]||'#4a5366'}">${esc(S.me.nombre.slice(0,1))}</span><div><b>${esc(S.me.nombre)}</b><div class="sub">${S.cr?'Familia + Cripto':'Familia'}</div></div></div>
    <button class="sh-opt" id="shPass">${has?'Cambiar mi clave':'Crear mi propia clave'}<span>›</span></button>
    ${has?'<button class="sh-opt" id="shReset">Volver a la clave original en este celular<span>›</span></button>':''}
    <button class="sh-opt" id="shOut" style="color:var(--dn)">Cerrar sesión<span>›</span></button>
    <div class="sec-t" style="margin:16px 2px 6px"><h2>Estado de los datos</h2></div>
    <div class="stline"><i class="${S.st.fin&&S.st.fin.ok?'ok':'bad'}"></i><div><b>Acciones</b><span>${esc(S.st.fin? S.st.fin.msg+' · '+hhmm(S.st.fin.at) : 'Sin consultar todavía')}</span></div></div>
    <div class="stline"><i class="${S.st.cr&&S.st.cr.ok?'ok':'bad'}"></i><div><b>Cripto</b><span>${esc(S.st.cr? S.st.cr.msg+' · '+hhmm(S.st.cr.at) : 'Sin consultar todavía')}</span></div></div>
    <div class="stline"><i class="${S.precios?'ok':'bad'}"></i><div><b>Cierres guardados</b><span>${esc(S.precios? 'al '+fdate(S.precios.fecha) : 'no disponibles')}</span></div></div>
    <div class="note" style="margin:12px 2px 0">${has?'En este celular entrás con tu clave propia. La clave original que te pasó Manu sigue funcionando por si te la olvidás o cambiás de teléfono.':'Tu clave propia queda guardada solo en este celular. La original sigue funcionando por si te la olvidás o cambiás de teléfono.'}</div>`;
  scrim.classList.add('open');
  document.getElementById('shPass').onclick=openPassSheet;
  document.getElementById('shOut').onclick=()=>{ lsSet(KEY_STORE,null); location.reload(); };
  const rs=document.getElementById('shReset'); if(rs) rs.onclick=()=>{ lsSet('fm_local_'+S.me.id,null); lsSet(KEY_STORE,null); toast('Listo, volvés a entrar con la clave original.'); setTimeout(()=>location.reload(),1200); };
});
const EXN=x=>/nasdaq/i.test(x)?'NASDAQ': /new york|nyse/i.test(x)?'NYSE': /arca|amex|american/i.test(x)?'AMEX':'';
async function lookupTicker(t){
  const q=await fetchQuote(t);
  let n=t, x='';
  try{ const k=(S.d.finnhub||[])[keyIdx]; const r=await fetch('https://finnhub.io/api/v1/stock/profile2?symbol='+encodeURIComponent(t)+'&token='+encodeURIComponent(k));
    if(r.ok){ const j=await r.json(); if(j&&j.name) n=j.name; if(j&&j.exchange) x=EXN(j.exchange); } }catch(_){}
  return {q, n, x};
}
function addToList(t, n, x){ const a=lista().filter(y=>y.t!==t); a.push({t, n:n||NOMBRES[t]||t, x:x||EXCH[t]||''}); setLista(a); toast(t+' agregada a tu lista'); }
function openListSheet(){
  sheet.innerHTML=`<h3>Agregar a mi lista</h3>
    <div class="field"><label>Ticker de Wall Street</label><input id="mlT" placeholder="Ej: KO, AMD, SPOT" autocapitalize="characters" autocomplete="off" spellcheck="false"></div>
    <div class="note" style="margin:0 2px 14px">Acciones y ETF que cotizan en EE.UU. La lista se guarda solo en este celular.</div>
    <div class="lock-err" id="mlErr" style="margin:0 0 10px"></div>
    <button class="btn" id="mlOk">Agregar</button>
    <button class="link" id="mlCancel" style="display:block;margin:14px auto 0">Cancelar</button>`;
  scrim.classList.add('open');
  const inp=document.getElementById('mlT'); setTimeout(()=>inp.focus(),50);
  document.getElementById('mlCancel').onclick=closeSheet;
  const go=async()=>{
    const t=inp.value.trim().toUpperCase().replace(/[^A-Z0-9.\-]/g,''), err=document.getElementById('mlErr'), b=document.getElementById('mlOk');
    if(!t){ err.textContent='Escribí un ticker.'; return; }
    if(enLista(t)){ err.textContent='Ya está en tu lista.'; return; }
    b.disabled=true; b.textContent='Buscando…'; err.textContent='';
    try{ const r=await lookupTicker(t); S.live[t]={c:r.q.c, pc:r.q.pc, dp:r.q.dp, t:r.q.t}; addToList(t, r.n, r.x); closeSheet(); render(); }
    catch(e){ err.textContent= /429/.test(String(e&&e.message))? 'Demasiadas consultas, probá en un minuto.' : 'No encontré "'+t+'" en Wall Street. Revisá el ticker.'; }
    finally{ b.disabled=false; b.textContent='Agregar'; }
  };
  document.getElementById('mlOk').onclick=go;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } });
}
function openPassSheet(){
  sheet.innerHTML=`<h3>Tu propia clave</h3>
    <div class="field"><label>Nueva clave</label><input id="np1" type="password" autocomplete="new-password" autocapitalize="none"></div>
    <div class="field"><label>Repetila</label><input id="np2" type="password" autocomplete="new-password" autocapitalize="none"></div>
    <div class="note" style="margin:0 2px 14px">Mínimo 6 caracteres. Queda guardada en este celular; la clave original sigue sirviendo si te la olvidás.</div>
    <div class="lock-err" id="npErr" style="margin:0 0 10px"></div>
    <button class="btn" id="npOk">Guardar mi clave</button>
    <button class="link" id="npCancel" style="display:block;margin:14px auto 0">Cancelar</button>`;
  scrim.classList.add('open');
  document.getElementById('npCancel').onclick=closeSheet;
  document.getElementById('npOk').onclick=async()=>{
    const a=document.getElementById('np1').value, c=document.getElementById('np2').value, err=document.getElementById('npErr');
    if(a.length<6){ err.textContent='Tiene que tener al menos 6 caracteres.'; return; }
    if(a!==c){ err.textContent='Las dos claves no coinciden.'; return; }
    const okb=document.getElementById('npOk'); okb.disabled=true; okb.textContent='Guardando…';
    try{
      const salt=toB64(crypto.getRandomValues(new Uint8Array(16))), iter=600000;
      const bits=await deriveBits(a,{salt, iter});
      const key=await crypto.subtle.importKey('raw',bits,{name:'AES-GCM'},false,['encrypt']);
      const iv=crypto.getRandomValues(new Uint8Array(12));
      const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(S.grant)));
      lsSet('fm_local_'+S.me.id, JSON.stringify({salt, iter, iv:toB64(iv), ct:toB64(ct)}));
      if(!localGet(S.me.id)){ err.textContent='Este navegador no deja guardar datos. Probá desde la app agregada al inicio.'; return; }
      lsSet(KEY_STORE, JSON.stringify({perfil:S.me.id, src:'local', salt, k:toB64(bits)}));
      S.askPass=false; closeSheet(); render(); toast('Listo. Desde ahora entrás con tu clave.');
    }catch(_){ err.textContent='No se pudo guardar. Probá de nuevo.'; }
    finally{ okb.disabled=false; okb.textContent='Guardar mi clave'; }
  };
}
(async function start(){
  try{ S.perfiles=(await getJSON('perfiles.json')).perfiles; }
  catch(_){ document.getElementById('profiles').innerHTML='<div class="lock-err">No se pudo cargar. Revisá la conexión y recargá.</div>'; return; }
  const box=document.getElementById('profiles');
  box.innerHTML=S.perfiles.map(p=>`<button type="button" class="prof" data-p="${esc(p.id)}"><span class="av" style="background:${AVC[p.id]||'#4a5366'}">${esc(p.nombre.slice(0,1))}</span><span>${esc(p.nombre)}</span></button>`).join('');
  box.addEventListener('click',e=>{ const b=e.target.closest('[data-p]'); if(b) pickProfile(S.perfiles.find(p=>p.id===b.dataset.p)); });
  const saved=lsGet(KEY_STORE); if(!saved) return;
  try{ const s=JSON.parse(saved); const p=S.perfiles.find(x=>x.id===s.perfil);
    const src= s.src==='local'? localGet(s.perfil) : p;
    if(!p||!src||src.salt!==s.salt){ lsSet(KEY_STORE,null); return; }
    pickEl.hidden=true; box.closest('.lock-card').style.opacity='.5';
    show(await loadVaults(await openSealed(b64(s.k), src), p));
  }catch(_){ lsSet(KEY_STORE,null); pickEl.hidden=false; document.querySelector('.lock-card').style.opacity='1'; }
})();
})();
</script>
