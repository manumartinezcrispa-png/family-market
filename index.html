<link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1284x2778.png?v=2">

<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1179x2556.png?v=2">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1170x2532.png?v=2">

<title>Family Market</title>

<style>
:root{
  color-scheme: light;
  --bg:#f6f7f9; --card:#ffffff; --soft:#f1f3f6; --line:#e9ecf1;
  --ink:#0d1321; --ink2:#4a5366; --mute:#8a92a3;
  --blue:#2a78d6; --blue-soft:#eaf1fb; --navy:#0d2c57;
  --up:#0a7a32; --up-soft:#e3f4ea; --dn:#d13b34; --dn-soft:#fbe7e6;
  --warn-bg:#fff6dc; --warn:#6b4a00;
  --shadow:0 1px 2px rgba(13,19,33,.04),0 6px 18px rgba(13,19,33,.05);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}
[hidden]{display:none!important}

/* ---------- lock ---------- */
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(170deg,#fff 0%,var(--bg) 60%)}
.lock-card{width:100%;max-width:360px;text-align:center}
.lock-card img{width:76px;height:76px;border-radius:18px;display:block;margin:0 auto 18px;box-shadow:0 10px 26px rgba(13,44,87,.28)}
.lock-card h1{margin:0 0 6px;font-size:26px;letter-spacing:-.5px;font-weight:800}
.lock-card p{margin:0 0 26px;color:var(--ink2);font-size:14.5px}
.lock-card input[type=password]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;font-size:17px;margin-bottom:12px;text-align:center;box-shadow:var(--shadow);outline:none}
.lock-card input[type=password]:focus{border-color:var(--blue)}
.remember{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;color:var(--ink2);margin:4px 0 18px}
.lock-err{color:var(--dn);font-size:13px;min-height:18px;margin-top:12px}
.btn{border:0;border-radius:14px;padding:15px 16px;font-weight:700;font-size:15.5px;cursor:pointer;background:var(--ink);color:#fff;width:100%}
.btn:disabled{opacity:.55}

/* ---------- shell ---------- */
.app{max-width:560px;margin:0 auto;padding:10px 16px calc(100px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:32px;height:32px;border-radius:9px;display:block}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.top-r{display:flex;align-items:center;gap:10px;flex:none}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.live.on{background:var(--up-soft);color:var(--up)}
.live.on i{background:var(--up);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(10,122,50,.45)}70%{box-shadow:0 0 0 7px rgba(10,122,50,0)}100%{box-shadow:0 0 0 0 rgba(10,122,50,0)}}
.link{background:none;border:0;color:var(--blue);font-weight:700;font-size:14px;cursor:pointer;padding:4px 0}

/* ticker tape */
.tape{margin:0 -16px 14px;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;position:relative}
.tape-in{display:inline-flex;gap:22px;padding:9px 16px;animation:tape 40s linear infinite}
.tape-in span{font-size:12.5px;font-weight:700;color:var(--ink)}
.tape-in span b{font-weight:700;margin-left:5px}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* cards */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.sec-t{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px}
.sec-t h2{margin:0;font-size:13px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.sec-t span{font-size:12px;color:var(--mute)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:11px 13px;font-size:13px;line-height:1.45;margin-bottom:12px}

/* hero */
.hero .k{font-size:13px;color:var(--ink2);font-weight:500}
.hero .tot{font-size:38px;font-weight:800;letter-spacing:-1.4px;margin:2px 0 4px;line-height:1.1}
.hero .chg{font-size:14px;font-weight:700}
.hero .chg small{font-weight:500;color:var(--ink2);font-size:13px}
.tf{display:flex;gap:4px;margin-top:10px;background:var(--soft);padding:3px;border-radius:11px}
.tf button{flex:1;border:0;background:none;font-size:12.5px;font-weight:700;color:var(--ink2);padding:7px 0;border-radius:9px;cursor:pointer}
.tf button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chart{position:relative;margin:12px -4px 0}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .empty{height:150px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mute);font-size:13px;padding:0 20px;line-height:1.45}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .1s}
.tip b{display:block;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow)}
.stat small{display:block;font-size:11.5px;color:var(--mute);font-weight:600;margin-bottom:3px}
.stat b{font-size:16px;font-weight:750;letter-spacing:-.2px}
.note{font-size:12px;color:var(--mute);line-height:1.45;margin:8px 4px 0}

/* holdings */
.list .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.list .row:first-child{border-top:0}
.list .row:active{opacity:.6}
.tk{width:40px;height:40px;border-radius:12px;background:var(--blue-soft);color:var(--blue);font-size:10.5px;font-weight:800;display:grid;place-items:center;flex:none;letter-spacing:-.2px}
.tk.cash{background:var(--soft);color:var(--ink2)}
.tk.big{width:48px;height:48px;font-size:12px;border-radius:14px}
.row .mid{flex:1;min-width:0}
.row .nm{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right}
.row .v{font-size:15px;font-weight:700}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 7px;border-radius:7px;margin-top:3px}
.chip.up{background:var(--up-soft)}.chip.dn{background:var(--dn-soft)}.chip.flat{background:var(--soft);color:var(--ink2)}
.fl-up{animation:flu 1.2s ease}.fl-dn{animation:fld 1.2s ease}
@keyframes flu{0%{background:rgba(10,122,50,.18)}100%{background:transparent}}
@keyframes fld{0%{background:rgba(209,59,52,.18)}100%{background:transparent}}
.subtotal{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);padding-top:10px;border-top:1px solid var(--line);margin-top:2px}

/* segmented */
.seg{display:flex;background:var(--soft);padding:3px;border-radius:12px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px 0;font-weight:700;font-size:13.5px;color:var(--ink2);border-radius:10px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* detail */
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--blue);font-weight:700;font-size:15px;padding:6px 0;cursor:pointer}
.dhead{display:flex;gap:12px;align-items:center;margin:8px 2px 12px}
.dhead .t1{font-size:19px;font-weight:800;letter-spacing:-.3px}
.dhead .t2{font-size:12.5px;color:var(--mute);font-weight:600}
.tv{height:360px;border-radius:14px;overflow:hidden;margin-top:12px;background:var(--soft)}
.tv .tradingview-widget-container,.tv .tradingview-widget-container__widget{height:100%;width:100%}
.mini-news{padding:12px 0;border-top:1px solid var(--line)}
.mini-news:first-child{border-top:0;padding-top:0}
.mini-news h3{font-size:14px;margin:0 0 4px;line-height:1.35}
.mini-news p{font-size:13px;color:var(--ink2);margin:0;line-height:1.5}

/* market */
.mk .row .sub{font-size:11.5px}

/* moves */
.mv{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.mv:first-child{border-top:0}
.mv .d{width:44px;flex:none;font-size:12px;color:var(--mute);font-weight:600;padding-top:2px}
.mv .b{flex:1;min-width:0}
.mv .ty{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.mv .ty.compra{color:var(--blue)}.mv .ty.aporte{color:var(--up)}.mv .ty.venta,.mv .ty.retiro{color:var(--dn)}
.mv .tx{font-size:14px;margin-top:3px;line-height:1.45}
.mv .am{font-weight:700;font-size:14px;white-space:nowrap}
.year{font-size:12px;font-weight:800;color:var(--mute);margin:16px 4px 8px;letter-spacing:.05em}

/* news */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{border:0;background:var(--card);color:var(--ink2);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;box-shadow:var(--shadow)}
.fchip.on{background:var(--ink);color:#fff}
.news{padding:14px 0;border-top:1px solid var(--line)}
.news:first-child{border-top:0;padding-top:2px}
.news .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--soft);color:var(--ink2)}
.badge.cartera{background:var(--blue-soft);color:var(--blue)}
.news .when{font-size:12px;color:var(--mute);margin-left:auto;font-weight:600}
.news h3{font-size:15.5px;line-height:1.35;margin:0 0 6px;font-weight:750;letter-spacing:-.1px}
.news p{font-size:14px;line-height:1.55;color:var(--ink2);margin:0}
.news .src{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--blue);text-decoration:none;font-weight:700}
.resumen{font-size:15px;line-height:1.55}
.ag{display:flex;gap:12px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.ag:first-child{border-top:0;padding-top:0}
.ag .d{width:48px;flex:none;font-weight:800;color:var(--blue);font-size:13px}
.ag.past{opacity:.4}
.idea{padding:12px 0;border-top:1px solid var(--line)}
.idea:first-child{border-top:0;padding-top:0}
.idea h3{font-size:14.5px;margin:0 0 4px}
.idea p{font-size:13.5px;color:var(--ink2);line-height:1.5;margin:0}
.disc{font-size:12px;color:var(--mute);margin-top:12px;font-style:italic}

/* accounts */
.acct .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.acct .nm{font-weight:800;font-size:16.5px;letter-spacing:-.2px}
.acct .who{font-size:12.5px;color:var(--mute);margin-top:3px}
.acct .amt{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:12px}
.acct .amt.na{font-size:15px;color:var(--mute);font-weight:600}
.acct .when{font-size:12px;color:var(--mute)}
.acct .rd{font-size:14px;margin-top:10px;font-weight:700}
.acct .det{font-size:13.5px;color:var(--ink2);line-height:1.55;margin-top:8px;white-space:pre-line}
.tag{font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:26px 10px;line-height:1.5}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;width:100%}
nav.tabs button{background:none;border:0;padding:6px 0 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--mute);cursor:pointer}
nav.tabs svg{width:23px;height:23px}
nav.tabs button.on{color:var(--blue)}
</style>
</head>
<body>
<div id="lock" class="lock">
  <form id="lockForm" class="lock-card" autocomplete="off">
    <img src="icons/icon-192.png?v=2" alt="">
    <h1>Family Market</h1>
    <p>Inversiones de los hermanos</p>
    <input id="pass" type="password" placeholder="Clave" autocomplete="current-password" autocapitalize="none" spellcheck="false">
    <label class="remember"><input type="checkbox" id="remember" checked> Recordarme en este celular</label>
    <button class="btn" id="enter" type="submit">Entrar</button>
    <div class="lock-err" id="lockErr"></div>
  </form>
</div>

<div id="appRoot" hidden>
<div class="app">
  <header class="top">
    <div class="brand"><img src="icons/icon-192.png?v=2" alt=""><b>Family Market</b></div>
    <div class="top-r"><span class="live" id="livePill" hidden><i></i><span id="liveTxt"></span></span><button class="link" id="logout" type="button">Salir</button></div>
  </header>
  <div class="tape" id="tape" hidden><div class="tape-in num" id="tapeIn"></div></div>
  <main id="view"></main>
</div>

<nav class="tabs"><div class="in">
  <button data-tab="inicio" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-tab="cartera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Cartera</button>
  <button data-tab="mercado"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Mercado</button>
  <button data-tab="noticias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13v14a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v10a2 2 0 0 1-2 2"/><path d="M8 9h5M8 13h5M8 17h3"/></svg>Noticias</button>
  <button data-tab="cuentas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>Cuentas</button>
</div></nav>
</div>

<script>
(function(){
"use strict";
const S = { d:null, precios:null, noticias:null, cierres:null, tab:'inicio', sub:'pos', nf:'todas', tf:'1D', det:null, dtf:'1D',
            live:{}, prev:{}, liveAt:0, liveOk:false, btc:null, dolar:null };
const KEY_STORE='fm_key_v1';
const TABS=['inicio','cartera','mercado','noticias','cuentas'];
const NOMBRES={SPY:'S&P 500',QQQ:'Nasdaq 100',DIA:'Dow Jones'};
const EXCH={ORCL:'NYSE',NU:'NYSE',SPY:'AMEX',DIA:'AMEX'};
const INDICES=['SPY','QQQ','DIA'];

/* ---------- helpers ---------- */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = typeof v==='number'?v:parseFloat(v); return isFinite(n)?n:0; };
const usd = (n,dec=0) => { if(n==null||!isFinite(n)) return '—'; const s=Math.abs(n).toLocaleString('es-AR',{minimumFractionDigits:dec,maximumFractionDigits:dec}); return (n<0?'−':'')+'US$ '+s; };
const usdS = (n,dec=0) => (n>0?'+':'')+usd(n,dec);
const ars = n => '$ '+Math.round(n).toLocaleString('es-AR');
const usdK = n => { const a=Math.abs(n); return (n<0?'−':'')+(a>=1000? (a/1000).toLocaleString('es-AR',{maximumFractionDigits:a>=100000?0:1})+'k' : Math.round(a)); };
const pct = (n,d=1) => { if(n==null||!isFinite(n)) return '—'; return (n>0?'+':n<0?'−':'')+Math.abs(n).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%'; };
const pctAbs = (n,d=1) => pct(n,d).replace('+','');
const cls = n => n>0?'up':n<0?'dn':'flat';
const arrow = n => n>0?'▲':n<0?'▼':'';
const fdate = s => { if(!s) return '—'; const p=String(s).slice(0,10).split('-'); if(p.length<3) return esc(s); return `${+p[2]}/${+p[1]}/${p[0]}`; };
const fds = s => { if(!s) return ''; const p=String(s).split('-'); return `${+p[2]}/${+p[1]}`; };
const daysSince = s => s? Math.floor((Date.now()-new Date(String(s).slice(0,10)+'T12:00:00').getTime())/86400000) : 0;
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const toB64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const hhmm = t => new Date(t).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
function nyNow(){ try{ return new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'})); }catch(_){ return new Date(); } }
function nyDate(){ const d=nyNow(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function marketOpen(){ const ny=nyNow(); const d=ny.getDay(), m=ny.getHours()*60+ny.getMinutes(); return d>0&&d<6&&m>=570&&m<960; }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
function lsSet(k,v){ try{ if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(_){} }

/* ---------- crypto ---------- */
async function deriveKey(pass, enc){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(enc.salt), iterations:enc.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function decrypt(key, enc){ const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(enc.iv)}, key, b64(enc.ct)); return JSON.parse(new TextDecoder().decode(pt)); }
async function getJSON(url){ const r = await fetch(url+'?t='+Date.now(), {cache:'no-store'}); if(!r.ok) throw new Error('http '+r.status); return r.json(); }

/* ---------- cálculo de la cartera ---------- */
function priceOf(t){
  const L=S.live[t]; if(L && L.c>0) return {p:L.c, pc:L.pc>0?L.pc:null, live:true};
  const c=S.d.cartera, pr=(S.precios&&S.precios.precios)||{}, prF=(S.precios&&S.precios.fecha)||'';
  if(prF && String(prF).slice(0,10)>=String(c.fecha||'') && pr[t]!=null) return {p:num(pr[t]), pc:null, live:false};
  const pos=(c.posiciones||[]).find(x=>x.ticker===t); return {p:pos?num(pos.precio):0, pc:null, live:false};
}
function calc(){
  const c = S.d && S.d.cartera; if(!c) return null;
  const pos=(c.posiciones||[]).map(p=>{
    const cant=num(p.cant), costo=num(p.costo), q=priceOf(p.ticker);
    const valor=cant*q.p, inv=cant*costo, pl=valor-inv;
    const dHoy = q.pc? cant*(q.p-q.pc) : null;
    return {...p, cant, costo, precio:q.p, pc:q.pc, live:q.live, valor, inv, pl, plp: inv? pl/inv*100:0, dHoy, dpHoy: q.pc? (q.p-q.pc)/q.pc*100 : null};
  });
  const liq=(c.liquidez||[]).map(l=>({...l, valor:num(l.valor)}));
  const acciones=pos.reduce((a,p)=>a+p.valor,0), invAcc=pos.reduce((a,p)=>a+p.inv,0);
  const liquidez=liq.reduce((a,l)=>a+l.valor,0), total=acciones+liquidez;
  pos.forEach(p=>p.peso= total? p.valor/total*100:0); liq.forEach(l=>l.peso= total? l.valor/total*100:0);
  pos.sort((a,b)=>b.valor-a.valor);
  const conHoy=pos.filter(p=>p.dHoy!=null), dHoy= conHoy.length? conHoy.reduce((a,p)=>a+p.dHoy,0) : null;
  const aporte=num(c.aporte), live=pos.some(p=>p.live);
  const prF=(S.precios&&S.precios.fecha)||'';
  return {c,pos,liq,acciones,invAcc,liquidez,total,plAcc:acciones-invAcc,aporte,gan:total-aporte,ganp: aporte?(total-aporte)/aporte*100:null,
          dHoy, dpHoy:(dHoy!=null && total-dHoy)? dHoy/(total-dHoy)*100 : null, live,
          fechaPrecios: live? 'live' : (prF && String(prF).slice(0,10)>=String(c.fecha||'') ? prF : c.fecha)};
}
function preciosTxt(k){ return k.fechaPrecios==='live' ? (marketOpen()? 'precios en vivo, '+hhmm(S.liveAt) : 'último precio, '+hhmm(S.liveAt)) : 'precios al '+fdate(k.fechaPrecios); }

/* ---------- series para el gráfico del total ---------- */
function intraKey(){ return 'fm_intra_'+nyDate(); }
function intraGet(){ try{ return JSON.parse(lsGet(intraKey())||'[]'); }catch(_){ return []; } }
function intraAdd(v){
  if(!marketOpen()) return;
  const a=intraGet(); const t=Date.now();
  if(a.length && t-a[a.length-1][0]<15000) return;
  a.push([t, Math.round(v*100)/100]); while(a.length>1500) a.shift();
  lsSet(intraKey(), JSON.stringify(a));
}
function seriesFor(tf, k){
  const now=Date.now();
  if(tf==='1D'){
    let a=intraGet().map(([t,v])=>({t,v}));
    if(!a.length && k.dHoy!=null){ a=[]; } // sin muestras todavía
    return a;
  }
  const days={'1S':7,'1M':31,'1A':366,'Todo':99999}[tf];
  const from=now-days*86400000;
  const pts=[];
  (S.d.historial||[]).forEach(h=>{ if(h.fecha&&h.valor!=null) pts.push({t:new Date(h.fecha+'T20:00:00Z').getTime(), v:num(h.valor), n:h.nota||''}); });
  // cierres diarios (cierres.json): valor = cantidades actuales × cierre + liquidez, solo desde la fecha de la composición
  const cz=(S.cierres&&S.cierres.fechas)||{}, c=S.d.cartera;
  Object.keys(cz).forEach(f=>{
    if(f < String(c.fecha||'')) return;
    const px=cz[f]; let v=0, ok=true;
    (c.posiciones||[]).forEach(p=>{ if(px[p.ticker]==null) ok=false; else v+=num(p.cant)*num(px[p.ticker]); });
    if(!ok) return; v+=(c.liquidez||[]).reduce((a,l)=>a+num(l.valor),0);
    pts.push({t:new Date(f+'T21:00:00Z').getTime(), v, n:'Cierre'});
  });
  pts.push({t:now, v:k.total, n:'Ahora'});
  pts.sort((a,b)=>a.t-b.t);
  // un punto por día (el último)
  const byDay=new Map(); pts.forEach(p=>byDay.set(new Date(p.t).toISOString().slice(0,10), p));
  return [...byDay.values()].filter(p=>p.t>=from);
}

/* ---------- gráfico de línea ---------- */
function niceStep(raw){ if(raw<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(raw))); const f=raw/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function lineChart(el, pts, opts){
  if(!el) return;
  if(pts.length<2){ el.innerHTML=`<div class="empty">${opts.emptyMsg||'Todavía no hay suficientes datos para este período.'}</div>`; return; }
  const W=Math.max(280, el.clientWidth||320), H=170, L=6, R=6, T=12, B=20;
  const base=opts.base;
  let lo=Math.min(...pts.map(p=>p.v), base!=null?base:Infinity), hi=Math.max(...pts.map(p=>p.v), base!=null?base:-Infinity);
  const pad=(hi-lo)*0.12||hi*0.01||1; lo-=pad; hi+=pad;
  const t0=pts[0].t, t1=pts[pts.length-1].t;
  const x=t=>L+(t-t0)/(t1-t0||1)*(W-L-R), y=v=>T+(hi-v)/(hi-lo||1)*(H-T-B);
  const first=base!=null?base:pts[0].v, last=pts[pts.length-1].v;
  const col = last>=first ? 'var(--up)' : 'var(--dn)';
  const gid='g'+Math.random().toString(36).slice(2,7);
  const d=pts.map((p,i)=>(i?'L':'M')+x(p.t).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const area=d+` L${x(t1).toFixed(1)} ${H-B} L${x(t0).toFixed(1)} ${H-B} Z`;
  const bl = base!=null? `<line x1="${L}" x2="${W-R}" y1="${y(base)}" y2="${y(base)}" stroke="#c3c9d3" stroke-dasharray="3 4"/>` : '';
  const lab0=opts.fmtT(pts[0].t), lab1=opts.fmtT(t1);
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'Gráfico')}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${last>=first?'#0a7a32':'#d13b34'}" stop-opacity=".16"/><stop offset="1" stop-color="${last>=first?'#0a7a32':'#d13b34'}" stop-opacity="0"/></linearGradient></defs>
    ${bl}<path d="${area}" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(t1)}" cy="${y(last)}" r="4.5" fill="${col}" stroke="#fff" stroke-width="2"/>
    <line class="cx" y1="${T}" y2="${H-B}" stroke="#8a92a3" opacity="0"/><circle class="cd" r="5" fill="${col}" stroke="#fff" stroke-width="2" opacity="0"/>
    <text x="${L}" y="${H-4}" font-size="10.5" fill="#8a92a3">${esc(lab0)}</text><text x="${W-R}" y="${H-4}" font-size="10.5" fill="#8a92a3" text-anchor="end">${esc(lab1)}</text>
  </svg><div class="tip"></div>`;
  const svg=el.querySelector('svg'), tip=el.querySelector('.tip'), cx=el.querySelector('.cx'), cd=el.querySelector('.cd');
  const move=e=>{ const r=svg.getBoundingClientRect(); const px=(e.clientX-r.left)*(W/r.width);
    let best=pts[0],bd=1e18; pts.forEach(p=>{const dd=Math.abs(x(p.t)-px); if(dd<bd){bd=dd;best=p;}});
    const X=x(best.t), Y=y(best.v); cx.setAttribute('x1',X); cx.setAttribute('x2',X); cx.setAttribute('opacity','.5'); cd.setAttribute('cx',X); cd.setAttribute('cy',Y); cd.setAttribute('opacity','1');
    tip.innerHTML=`<b>${usd(best.v)}</b>${esc(opts.fmtTip(best.t))}${best.n&&best.n!=='Ahora'&&best.n!=='Cierre'?' · '+esc(best.n):''}`;
    tip.style.left=Math.min(Math.max(X*(r.width/W),70),r.width-70)+'px'; tip.style.top=(Y*(r.height/H))+'px'; tip.style.opacity='1'; };
  const out=()=>{ tip.style.opacity='0'; cx.setAttribute('opacity','0'); cd.setAttribute('opacity','0'); };
  svg.addEventListener('pointermove',move); svg.addEventListener('pointerdown',move); svg.addEventListener('pointerleave',out);
}
function drawTotalChart(k){
  const el=document.getElementById('tchart'); if(!el) return;
  const pts=seriesFor(S.tf,k);
  const intraday=S.tf==='1D';
  let base=null;
  if(intraday && k.dHoy!=null) base=k.total-k.dHoy;
  if(intraday && pts.length===1 && base!=null) pts.unshift({t:pts[0].t-60000, v:base});
  lineChart(el, pts, {
    base, aria:'Valor de la cuenta',
    emptyMsg: intraday ? (marketOpen()? 'El gráfico del día se va dibujando mientras tenés la app abierta. Volvé en un rato.' : 'El mercado está cerrado. El gráfico del día se arma mientras la app está abierta en horario de mercado (11:30 a 18 h).') : 'Todavía no hay suficientes datos para este período.',
    fmtT: t => intraday? hhmm(t) : new Date(t).toLocaleDateString('es-AR',{day:'numeric',month:'numeric',year:S.tf==='Todo'||S.tf==='1A'?'2-digit':undefined}),
    fmtTip: t => intraday? hhmm(t) : new Date(t).toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'})
  });
}

function vNoticias(){
  const n=S.noticias; if(!n) return `<div class="card empty">Todavía no hay noticias cargadas.</div>`;
  const filtros=[['todas','Todas'],['cartera','Nuestra cartera'],['mercado','Mercado'],['agenda','Agenda'],['ideas','Para mirar']];
  const f=S.nf;
  const items=(n.items||[]).filter(i=>f==='todas'||i.tipo===f).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  const hoy=new Date().toISOString().slice(0,10);
  const upd=n.actualizado? new Date(n.actualizado):null;
  const updTxt= upd&&!isNaN(upd)? upd.toLocaleDateString('es-AR',{day:'numeric',month:'long'})+', '+hhmm(upd) : '';
  const newsHtml=items.map(newsItem).join('');
  const agHtml=(n.agenda||[]).slice().sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))).map(a=>`<div class="ag ${String(a.fecha)<hoy?'past':''}"><span class="d num">${fds(a.fecha)}</span><span>${esc(a.evento)}</span></div>`).join('');
  const ideasHtml=(n.ideas||[]).map(i=>`<div class="idea"><h3>${esc(i.titulo)}</h3><p>${esc(i.texto)}</p></div>`).join('')+`<div class="disc">Información para seguir el mercado, no es una recomendación de compra o venta.</div>`;
  const sec=(t,b)=>`<div class="sec-t"><h2>${t}</h2></div><div class="card">${b}</div>`;
  let body='';
  if(f==='todas') body=`${n.resumen?sec('Resumen',`<div class="resumen">${esc(n.resumen)}</div>`):''}${newsHtml?sec('Noticias',newsHtml):''}${agHtml?sec('Agenda',agHtml):''}${(n.ideas||[]).length?sec('Para mirar',ideasHtml):''}`;
  else if(f==='agenda') body=sec('Agenda',agHtml||'<div class="empty">Sin eventos.</div>');
  else if(f==='ideas') body=sec('Para mirar',ideasHtml);
  else body=sec(f==='cartera'?'Nuestra cartera':'Mercado', newsHtml||'<div class="empty">Sin noticias.</div>');
  return `<div class="chips">${filtros.map(([k,l])=>`<button class="fchip ${k===f?'on':''}" data-nf="${k}">${l}</button>`).join('')}</div>
    ${updTxt?`<div class="note" style="margin:-2px 4px 0">Actualizado el ${esc(updTxt)}</div>`:''}${body}`;
}
function newsItem(i){
  return `<div class="news"><div class="meta"><span class="badge ${esc(i.tipo)}">${i.tipo==='cartera'?'En cartera':'Mercado'}</span>${(i.tickers||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join('')}<span class="when num">${fds(i.fecha)}</span></div>
    <h3>${esc(i.titulo)}</h3><p>${esc(i.texto)}</p>
    ${i.url&&/^https:\/\//.test(i.url)?`<a class="src" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${esc(i.fuente||'Fuente')} ↗</a>`:''}</div>`;
}

function vCuentas(){
  const list=[...(S.d.cuentas||[])].sort((a,b)=>num(a.orden)-num(b.orden));
  const k=calc();
  const val=c=>(c.orden===1&&k)? k.total : (c.valor!=null&&c.valor!==''? num(c.valor):null);
  const fec=c=>(c.orden===1&&k)? (k.fechaPrecios==='live'?'hoy':fdate(k.fechaPrecios)) : fdate(c.fecha);
  const sum=list.reduce((a,c)=>a+(val(c)||0),0);
  return `<div class="card hero"><div class="k">Total conocido entre las cuentas</div><div class="tot num" style="font-size:32px">${usd(sum)}</div><div class="note" style="margin:4px 0 0">Suma las cuentas con monto cargado, cada una a su propia fecha.</div></div>
  ${list.map(c=>`<div class="card acct"><div class="hd"><div><div class="nm">${esc(c.nombre)}</div><div class="who">${esc(c.gestor||'')}${c.custodio?` · ${esc(c.custodio)}`:''}</div></div>${c.tipo?`<span class="tag">${esc(c.tipo)}</span>`:''}</div>
    ${val(c)!=null?`<div class="amt num">${usd(val(c))}</div><div class="when">al ${esc(fec(c))}</div>`:`<div class="amt na">Monto sin cargar</div>`}
    ${c.rendimiento?`<div class="rd">${esc(c.rendimiento)}</div>`:''}${c.detalle?`<div class="det">${esc(c.detalle)}</div>`:''}</div>`).join('')}`;
}

/* ---------- detalle con gráfico de TradingView ---------- */
function tvSymbol(t){
  if(t==='BTC') return 'BITSTAMP:BTCUSD';
  if(t==='MERVAL') return 'BCBA:IMV';
  const pos=((S.d.cartera&&S.d.cartera.posiciones)||[]).find(p=>p.ticker===t);
  return (pos&&pos.mercado? pos.mercado : (EXCH[t]||'NASDAQ'))+':'+t;
}
const DTF={'1D':{range:'1D',interval:'5'},'1S':{range:'5D',interval:'30'},'1M':{range:'1M',interval:'60'},'3M':{range:'3M',interval:'D'},'1A':{range:'12M',interval:'D'},'5A':{range:'60M',interval:'W'}};
function vDetalle(){
  const t=S.det, k=calc();
  const p=k&&k.pos.find(x=>x.ticker===t);
  let name = p? (p.nombre||t) : (NOMBRES[t]|| (t==='BTC'?'Bitcoin': t==='MERVAL'?'S&P Merval':t));
  let q = t==='BTC'? S.btc : S.live[t];
  const px = p? p.precio : (q? q.c : null);
  const dp = p? p.dpHoy : (q&&q.pc? (q.c-q.pc)/q.pc*100 : (q&&q.dp!=null?q.dp:null));
  const dAbs = p&&p.pc? p.precio-p.pc : (q&&q.pc? q.c-q.pc : null);
  const news=((S.noticias&&S.noticias.items)||[]).filter(i=>(i.tickers||[]).includes(t)||(t==='BTC'&&(i.tickers||[]).includes('IBIT')));
  const ag=((S.noticias&&S.noticias.agenda)||[]).filter(a=>String(a.evento).includes(t));
  return `<button class="back" data-back="1">‹ Volver</button>
  <div class="dhead"><div class="tk big">${esc(t.slice(0,5))}</div><div><div class="t1">${esc(name)}</div><div class="t2">${esc(tvSymbol(t).replace(':',' · '))}</div></div></div>
  ${t!=='MERVAL'?`<div class="card hero"><div class="tot num" id="dPx">${px!=null? usd(px, px<1000?2:0) : '—'}</div>
    <div class="chg num" id="dChg">${dp!=null?`<span class="${cls(dp)}">${arrow(dp)} ${dAbs!=null?usd(Math.abs(dAbs),2)+' ':''}(${pct(dp,2)})</span> <small>${marketOpen()?'hoy':'última rueda'}</small>`:'<small>Sin cotización en vivo</small>'}</div>
    <div class="tv" id="tvBox"></div>
    <div class="tf" id="dtfBar">${Object.keys(DTF).map(x=>`<button data-dtf="${x}" class="${x===S.dtf?'on':''}">${x}</button>`).join('')}</div></div>`
  : `<div class="card"><div class="tv" id="tvBox" style="margin-top:0"></div><div class="tf" id="dtfBar">${Object.keys(DTF).map(x=>`<button data-dtf="${x}" class="${x===S.dtf?'on':''}">${x}</button>`).join('')}</div></div>`}
  ${p?`<div class="stats num">
    <div class="stat"><small>Tenemos</small><b>${p.cant.toLocaleString('es-AR')} acc.</b></div>
    <div class="stat"><small>Valor</small><b>${usd(p.valor)}</b></div>
    <div class="stat"><small>Costo promedio</small><b>${usd(p.costo,2)}</b></div>
    <div class="stat"><small>Resultado</small><b class="${cls(p.pl)}">${usdS(p.pl)} (${pct(p.plp)})</b></div>
    <div class="stat"><small>Peso en la cuenta</small><b>${pctAbs(p.peso)}</b></div>
    <div class="stat"><small>Próximo evento</small><b style="font-size:13.5px">${ag.length? esc(fds(ag[0].fecha)+' · '+ag[0].evento.replace(/\s*\(.*?\)/g,'')) : 'Sin eventos cargados'}</b></div>
  </div>`:''}
  ${news.length?`<div class="sec-t"><h2>Noticias</h2></div><div class="card">${news.map(newsItem).join('')}</div>`:''}`;
}
function mountTV(){
  const box=document.getElementById('tvBox'); if(!box) return;
  const cfg=DTF[S.dtf]||DTF['1D'];
  box.innerHTML='';
  const wrap=document.createElement('div'); wrap.className='tradingview-widget-container';
  const inner=document.createElement('div'); inner.className='tradingview-widget-container__widget'; wrap.appendChild(inner);
  const sc=document.createElement('script'); sc.type='text/javascript'; sc.async=true;
  sc.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
  sc.textContent=JSON.stringify({autosize:true, symbol:tvSymbol(S.det), interval:cfg.interval, range:cfg.range, timezone:'America/Argentina/Buenos_Aires',
    theme:'light', style:'1', locale:'es', hide_top_toolbar:true, hide_legend:true, hide_side_toolbar:true, allow_symbol_change:false, save_image:false,
    calendar:false, hide_volume:true, withdateranges:false, backgroundColor:'rgba(255,255,255,1)', gridColor:'rgba(233,236,241,1)', support_host:'https://www.tradingview.com'});
  wrap.appendChild(sc); box.appendChild(wrap);
}

/* ---------- render ---------- */
S.flash={};
function render(){
  const v=document.getElementById('view');
  if(S.det){ v.innerHTML=vDetalle(); mountTV(); }
  else {
    const map={inicio:vInicio,cartera:vCartera,mercado:vMercado,noticias:vNoticias,cuentas:vCuentas};
    v.innerHTML=(map[S.tab]||vInicio)();
    if(S.tab==='inicio'){ const k=calc(); if(k) drawTotalChart(k); }
  }
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  renderTape();
}
// actualización liviana del detalle (no recarga el gráfico de TradingView)
function softDetail(){
  const t=S.det; const k=calc(); const p=k&&k.pos.find(x=>x.ticker===t);
  const q= t==='BTC'? S.btc : S.live[t];
  const px= p? p.precio : (q? q.c:null); const dp= p? p.dpHoy : (q&&q.pc?(q.c-q.pc)/q.pc*100:(q&&q.dp!=null?q.dp:null));
  const dAbs= p&&p.pc? p.precio-p.pc : (q&&q.pc? q.c-q.pc:null);
  const a=document.getElementById('dPx'), b=document.getElementById('dChg');
  if(a&&px!=null){ const old=a.textContent; a.textContent=usd(px, px<1000?2:0); if(old!==a.textContent){ a.classList.remove('fl-up','fl-dn'); void a.offsetWidth; a.classList.add((S.flash[t]||'fl-up')); } }
  if(b&&dp!=null) b.innerHTML=`<span class="${cls(dp)}">${arrow(dp)} ${dAbs!=null?usd(Math.abs(dAbs),2)+' ':''}(${pct(dp,2)})</span> <small>${marketOpen()?'hoy':'última rueda'}</small>`;
}
function renderTape(){
  const tape=document.getElementById('tape'), inn=document.getElementById('tapeIn');
  const items=[];
  const add=(lbl,q)=>{ if(!q) return; const dp=q.pc? (q.c-q.pc)/q.pc*100 : q.dp; if(dp==null||!isFinite(dp)) return; items.push(`<span>${esc(lbl)}<b class="${cls(dp)}">${pct(dp,2)}</b></span>`); };
  add('S&P 500',S.live.SPY); add('Nasdaq',S.live.QQQ); add('BTC',S.btc);
  ((S.d&&S.d.cartera&&S.d.cartera.posiciones)||[]).forEach(p=>add(p.ticker,S.live[p.ticker]));
  if(!items.length){ tape.hidden=true; return; }
  const html=items.join('');
  if(inn.dataset.h!==html){ inn.innerHTML=html+html; inn.dataset.h=html; }
  tape.hidden=false;
}

/* ---------- eventos ---------- */
document.querySelector('nav.tabs').addEventListener('click',e=>{ const b=e.target.closest('button[data-tab]'); if(!b) return; S.tab=b.dataset.tab; S.det=null; try{location.hash=S.tab;}catch(_){} render(); window.scrollTo(0,0); });
document.getElementById('view').addEventListener('click',e=>{
  const d=e.target.closest('[data-det]'); if(d){ S.det=d.dataset.det; S.dtf='1D'; render(); window.scrollTo(0,0); return; }
  if(e.target.closest('[data-back]')){ S.det=null; render(); return; }
  const tf=e.target.closest('[data-tf]'); if(tf){ S.tf=tf.dataset.tf; document.querySelectorAll('#tfBar button').forEach(b=>b.classList.toggle('on',b.dataset.tf===S.tf)); const k=calc(); if(k) drawTotalChart(k); return; }
  const dtf=e.target.closest('[data-dtf]'); if(dtf){ S.dtf=dtf.dataset.dtf; document.querySelectorAll('#dtfBar button').forEach(b=>b.classList.toggle('on',b.dataset.dtf===S.dtf)); mountTV(); return; }
  const sb=e.target.closest('[data-sub]'); if(sb){ S.sub=sb.dataset.sub; render(); return; }
  const nf=e.target.closest('[data-nf]'); if(nf){ S.nf=nf.dataset.nf; render(); return; }
});
let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(S.d&&!S.det&&S.tab==='inicio'){ const k=calc(); if(k) drawTotalChart(k); } },150); });
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(S.d&&TABS.includes(h)&&(h!==S.tab||S.det)){ S.tab=h; S.det=null; render(); } });
{ const h=(location.hash||'').slice(1); if(TABS.includes(h)) S.tab=h; }

/* ---------- datos en vivo ---------- */
let keyIdx=0, liveTimer=null, tick=0;
async function fetchQuote(sym){
  const keys=(S.d&&S.d.finnhub)||[]; if(!keys.length) throw new Error('sin clave');
  for(let i=0;i<keys.length;i++){
    const k=keys[(keyIdx+i)%keys.length];
    const r=await fetch('https://finnhub.io/api/v1/quote?symbol='+encodeURIComponent(sym)+'&token='+encodeURIComponent(k));
    if(r.status===401||r.status===403) continue;
    if(!r.ok) throw new Error('http '+r.status);
    keyIdx=(keyIdx+i)%keys.length;
    const q=await r.json(); if(!q||!(q.c>0)) throw new Error('sin dato'); return q;
  }
  throw new Error('clave rechazada');
}
async function refreshStocks(){
  const syms=[...new Set(((S.d.cartera&&S.d.cartera.posiciones)||[]).map(p=>p.ticker).concat(INDICES))];
  const res=await Promise.allSettled(syms.map(s=>fetchQuote(s)));
  let ok=0;
  res.forEach((r,i)=>{ if(r.status!=='fulfilled') return; const s=syms[i], q=r.value; const old=S.live[s];
    if(old&&old.c!==q.c) S.flash[s]= q.c>old.c?'fl-up':'fl-dn';
    S.live[s]={c:q.c, pc:q.pc, dp:q.dp, t:q.t}; ok++; });
  if(ok){ S.liveOk=true; S.liveAt=Date.now(); const k=calc(); if(k&&k.live) intraAdd(k.total); }
}
async function refreshBTC(){
  try{ const r=await fetch('https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT'); if(!r.ok) return; const j=await r.json();
    const c=parseFloat(j.lastPrice), dp=parseFloat(j.priceChangePercent); if(!(c>0)) return;
    if(S.btc&&S.btc.c!==c) S.flash.BTC = c>S.btc.c?'fl-up':'fl-dn';
    S.btc={c, dp, pc: isFinite(dp)? c/(1+dp/100) : null}; // referencia: hace 24 h
  }catch(_){}
}
async function refreshDolar(){
  try{ const r=await fetch('https://dolarapi.com/v1/dolares'); if(!r.ok) return; const j=await r.json();
    const want={oficial:'oficial',blue:'blue',bolsa:'MEP',contadoconliqui:'CCL'};
    S.dolar=j.filter(x=>want[x.casa]).map(x=>({nombre:want[x.casa], compra:x.compra, venta:x.venta}));
  }catch(_){}
}
function setPill(){
  const pill=document.getElementById('livePill'), txt=document.getElementById('liveTxt');
  if(!S.liveOk){ pill.hidden=true; return; }
  const open=marketOpen(); pill.hidden=false; pill.classList.toggle('on',open); txt.textContent= open?'En vivo':'Cerrado';
}
async function liveCycle(force){
  if(!S.d || document.hidden) return;
  const open=marketOpen(); S.flash={};
  const jobs=[refreshBTC()];
  if(force || open || Date.now()-S.liveAt>300000) jobs.push(refreshStocks());
  if(force || tick%15===0) jobs.push(refreshDolar());
  tick++;
  await Promise.allSettled(jobs);
  setPill();
  if(S.det) softDetail(); else if(!(S.tab==='noticias' || S.tab==='cuentas') || force) render(); else renderTape();
}
function startLive(){ if(liveTimer) return; liveCycle(true); liveTimer=setInterval(()=>liveCycle(false), 20000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) liveCycle(true); }); }

/* ---------- acceso ---------- */
const lockEl=document.getElementById('lock'), appEl=document.getElementById('appRoot'), errEl=document.getElementById('lockErr'), btn=document.getElementById('enter');
let ENC=null;
async function loadEnc(){ if(!ENC) ENC=await getJSON('data.enc.json'); return ENC; }
async function loadPublic(){
  const [p,n,c]=await Promise.allSettled([getJSON('precios.json'),getJSON('noticias.json'),getJSON('cierres.json')]);
  S.precios=p.status==='fulfilled'?p.value:null; S.noticias=n.status==='fulfilled'?n.value:null; S.cierres=c.status==='fulfilled'?c.value:null;
}
function show(data){ S.d=data; lockEl.hidden=true; appEl.hidden=false; render(); startLive(); }
document.getElementById('lockForm').addEventListener('submit', async e=>{
  e.preventDefault(); errEl.textContent='';
  const pass=document.getElementById('pass').value.trim(); if(!pass){ errEl.textContent='Escribí la clave.'; return; }
  if(!window.crypto||!crypto.subtle){ errEl.textContent='Este navegador no permite abrir la app. Probá con Safari o Chrome actualizados.'; return; }
  btn.disabled=true; btn.textContent='Abriendo…';
  try{
    const enc=await loadEnc(); await loadPublic();
    const key=await deriveKey(pass, enc);
    let data; try{ data=await decrypt(key, enc); }catch(_){ errEl.textContent='Clave incorrecta.'; return; }
    if(document.getElementById('remember').checked){ const raw=await crypto.subtle.exportKey('raw', key); lsSet(KEY_STORE, JSON.stringify({salt:enc.salt, k:toB64(raw)})); }
    show(data);
  }catch(_){ errEl.textContent='No se pudieron cargar los datos. Revisá la conexión.'; }
  finally{ btn.disabled=false; btn.textContent='Entrar'; }
});
document.getElementById('logout').addEventListener('click',()=>{ lsSet(KEY_STORE,null); location.reload(); });
(async function auto(){
  const saved=lsGet(KEY_STORE); if(!saved) return;
  try{ const s=JSON.parse(saved); const enc=await loadEnc(); await loadPublic();
    if(s.salt!==enc.salt){ lsSet(KEY_STORE,null); return; }
    const key=await crypto.subtle.importKey('raw', b64(s.k), {name:'AES-GCM'}, false, ['decrypt']);
    show(await decrypt(key, enc));
  }catch(_){ lsSet(KEY_STORE,null); }
})();
})();
